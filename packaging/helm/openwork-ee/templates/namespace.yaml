{{- /*
  ⚠️ ArgoCD/GitOps operators: set createNamespace=false and instead add
  `syncOptions: [CreateNamespace=true]` to the Application. Do not leave
  createNamespace=true under ArgoCD — see why below.

  lookup returns empty under helm template / ArgoCD repo-server rendering (no
  live cluster connection during rendering), so `$existing` below is always
  empty there regardless of whether the namespace already exists. That means
  under ArgoCD this Namespace unconditionally renders as a fresh hook on
  every single sync — and, same as any Helm/Argo CD hook with no explicit
  hook-delete-policy, it defaults to before-hook-creation (Argo CD: "if no
  deletion policy is specified, Argo CD will automatically assume
  BeforeHookCreation rules"; Helm's docs state the identical default).
  Unlike the migration RBAC/ExternalSecret hooks, this default is genuinely
  dangerous here: deleting a Namespace cascades to delete every resource
  inside it, so leaving createNamespace=true under ArgoCD means the whole
  release — Deployments, Secrets, everything — gets torn down and rebuilt on
  every sync. There is no hook-delete-policy value that avoids this while
  keeping the Namespace a hook (before-hook-creation is the only sane choice
  for a resource that must exist before other pre-install hooks, and the
  alternatives — hook-succeeded/hook-failed — would delete the Namespace
  outright once the sync finishes). The only real fix is to keep this
  resource from rendering at all under ArgoCD: set createNamespace=false so
  this whole block is skipped, and let ArgoCD create the namespace itself via
  `syncOptions: [CreateNamespace=true]` — a native, non-hook, one-time
  operation with no delete-then-recreate lifecycle.

  This does NOT let a first install skip pre-provisioning the *release*
  namespace itself (the one passed via `helm install --namespace`): Helm
  creates its own release-tracking record there before running any hook, so
  if that namespace does not already exist and --create-namespace was not
  passed, the install fails immediately, before this (or any) pre-install
  hook ever runs. This hook only helps when the chart's own `namespace` value
  (above) names a *different*, not-yet-existing namespace than the one Helm's
  release itself lives in (which must already exist, or be created via
  --create-namespace, some other way).

  For a genuine (non-ArgoCD) helm install/upgrade CLI run, lookup has real
  cluster access, and the branches below make three decisions, in order,
  based on what it finds live — all confirmed empirically against a real
  cluster, including checking object identity (UID) and a canary resource's
  survival across each transition, not just "the command succeeded":

  1. Nothing exists yet: render as the earliest hook (weight -11, preceding
     the ExternalSecret's -10) so a first-time install works without
     pre-provisioning the target namespace. Safe — there is nothing to
     endanger yet.

  2. It exists and already carries EITHER `helm.sh/hook` or
     `helm.sh/resource-policy: keep`: omit rendering entirely, exactly like
     the lookup-skip this file has always used. This covers two safe,
     no-action-needed states: a Namespace already protected by a prior
     release running this same logic (`keep` is checked against the *live*
     object's current annotations, not the newly-rendered manifest, so an
     omitted-but-already-protected resource survives regardless); and —
     critically — the common case of a release that predates this file even
     existing that already had the Namespace as a hook under the *old*
     default (createNamespace=true, migrations.hook=true), which never
     carried resource-policy: keep at all (this file only just started
     adding it) but was never at risk in the first place: hook resources are
     never tracked as part of "the release" ("hook resources are not managed
     with corresponding releases", per Helm's docs), so their disappearing
     from a later render was never interpreted as deletion the way an
     ordinary resource's would be. Leaving that population alone rather than
     "fixing" it by re-rendering as a hook (attempting to add the missing
     keep annotation) matters: re-entering the hook path for a resource
     Helm's hook-history already has a record of creating for this release
     triggers before-hook-creation's delete-then-create — confirmed
     empirically as destructive here, exactly the failure mode this whole
     file exists to avoid — so a hook-classified Namespace is left exactly
     as it is, unconditionally, forever.

  3. It exists but carries NEITHER marker: the one remaining population —
     specifically a release that had createNamespace=true (the old default)
     and migrations.hook=false (the documented log-retention troubleshooting
     toggle), where the Namespace was rendered as an ordinary, Helm-tracked,
     non-hook resource with no annotation of either kind. Render it as a
     plain, non-hook manifest (never as a hook) with resource-policy: keep
     newly added. Reclassifying at all here — in *either* direction — is
     destructive, confirmed empirically: presenting an existing
     hook-created resource as an ordinary one fails outright ("exists and
     cannot be imported into the current release: invalid ownership
     metadata", since hook-created resources never receive Helm's
     release-ownership labels — this is also why case 2 must never attempt
     to "upgrade" a hook-classified Namespace into carrying resource-policy:
     keep by rendering it as a plain manifest instead); and presenting an
     existing ordinary resource as a hook for the first time deletes it
     before the new hook's own annotations ever apply — confirmed by
     watching a canary resource inside the namespace get wiped out and the
     namespace's UID change, even though the new hook render included the
     keep annotation. So this case is a same-kind (plain to plain) in-place
     update: Helm patches the existing, already release-owned resource,
     which safely stamps the missing annotation onto it going forward — the
     very next release then satisfies case 2 above and stops touching it.

  A namespace that exists with neither Helm's own release-ownership labels
  nor either marker (created entirely outside Helm, e.g. manually or by
  ArgoCD's own CreateNamespace=true while createNamespace was also left true
  here by mistake) hits case 3 and fails the same "cannot be imported"
  ownership check — a loud, non-destructive error prompting a config fix,
  which is the correct outcome for that misconfiguration.
*/ -}}
{{- $namespaceName := include "openwork-ee.namespace" . | trimAll "\"" -}}
{{- if .Values.createNamespace -}}
{{- $existing := lookup "v1" "Namespace" "" $namespaceName -}}
{{- $existingAnnotations := dict -}}
{{- if $existing -}}
{{- $existingMeta := $existing.metadata | default dict -}}
{{- $existingAnnotations = $existingMeta.annotations | default dict -}}
{{- end -}}
{{- $alreadySafe := or (hasKey $existingAnnotations "helm.sh/hook") (eq (get $existingAnnotations "helm.sh/resource-policy" | default "") "keep") -}}
{{- if not $existing }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/resource-policy": keep
{{- else if not $alreadySafe }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
{{- end }}
{{- end }}
