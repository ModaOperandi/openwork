{{- /*
  ⚠️ ArgoCD/GitOps operators: set createNamespace=false and instead add
  `syncOptions: [CreateNamespace=true]` to the Application. Do not leave
  createNamespace=true under ArgoCD — see why below.

  lookup returns empty under helm template / ArgoCD repo-server rendering (no
  live cluster connection during rendering), so `not $existing` below is
  always true there regardless of whether the namespace already exists. That
  means under ArgoCD this Namespace unconditionally renders as a hook on
  every single sync — and, same as any Helm/Argo CD hook with no explicit
  hook-delete-policy, it defaults to before-hook-creation (Argo CD: "if no
  deletion policy is specified, Argo CD will automatically assume
  BeforeHookCreation rules"; Helm's docs state the identical default).
  Unlike the migration RBAC/ExternalSecret hooks, this default is genuinely
  dangerous here: deleting a Namespace cascades to delete every resource
  inside it, so leaving createNamespace=true under ArgoCD means the whole
  release — Deployments, Secrets, everything — gets torn down and rebuilt on
  every sync. There is no hook-delete-policy value that avoids this while
  keeping the Namespace a hook (before-hook-creation is the only sane choice
  for a resource that must exist before other pre-install hooks, and the
  alternatives — hook-succeeded/hook-failed — would delete the Namespace
  outright once the sync finishes). The only real fix is to keep this
  resource from rendering at all under ArgoCD: set createNamespace=false so
  this whole block is skipped, and let ArgoCD create the namespace itself via
  `syncOptions: [CreateNamespace=true]` — a native, non-hook, one-time
  operation with no delete-then-recreate lifecycle.

  For a genuine (non-ArgoCD) `helm install`/`helm upgrade` CLI run with the
  default migrations.hook=true, lookup has real cluster access, so this guard
  behaves as intended: first install renders the Namespace as the earliest
  hook (weight -11, preceding the ExternalSecret's -10) so a first-time
  install into a fresh namespace works without pre-provisioning it, then
  every subsequent `helm upgrade` sees the namespace already exists and skips
  rendering it, never re-entering the hook path (and therefore never hitting
  the before-hook-creation default) at all. helm uninstall does not remove
  hook resources, so the Namespace outlives the release even in that path
  (intentional — deleting it would cascade to any externally-created
  resources in it).

  The lookup-skip trick above only applies while this renders as a hook.
  With migrations.hook=false the Namespace instead renders as a plain,
  non-hook manifest — and Helm does NOT exempt plain resources from release
  tracking the way it does hooks ("hook resources are not managed with
  corresponding releases", per Helm's docs; ordinary resources are). If the
  same lookup-and-skip-once-it-exists logic were applied there too, the first
  `helm install` would render it once (tracked as part of the release), and
  every subsequent `helm upgrade` would then omit it (lookup finds it) —
  which Helm reads as "this resource was removed from the chart" and deletes
  it, cascading the same way. So the branch below only ever gates the
  cluster-scoped lookup — and the create-vs-skip decision it drives — behind
  migrations.hook: in hook mode, skip once it exists; in plain-manifest mode,
  always render it (a plain Namespace apply is naturally idempotent, a no-op
  patch when unchanged, so there is no cost to never skipping it).

  Defense in depth, on top of the above: every branch below also carries
  `helm.sh/resource-policy: keep`. Helm's own docs are explicit that this
  "instructs Helm to skip deleting this resource when a helm operation (such
  as helm uninstall, helm upgrade or helm rollback) would result in its
  deletion" — i.e. unlike the hook-exemption this chart otherwise relies on,
  it is not conditional on how the resource is currently classified, so it
  also covers transitions the logic above cannot: flipping migrations.hook
  across an upgrade (plain-tracked one release, hook-and-lookup-skipped the
  next — the skip would otherwise read as "removed" to Helm), and any
  pre-existing release from before this file supported non-hook rendering at
  all, where the Namespace may already be a plain tracked resource in Helm's
  stored release history for reasons this template can no longer see or
  control. The trade-off, per Helm's docs: the Namespace becomes "orphaned"
  the moment such a transition happens — Helm stops actively managing it
  (no more label updates from this chart) — but it is never destructively
  deleted. That is the correct trade for a resource whose deletion cascades
  to the entire release.
*/ -}}
{{- $namespaceName := include "openwork-ee.namespace" . | trimAll "\"" -}}
{{- if .Values.createNamespace }}
{{- if .Values.migrations.hook }}
{{- /*
  Gate the cluster-scoped lookup behind migrations.hook too: restricted-RBAC
  helm install/upgrade (no get on cluster Namespaces) can still use the
  always-render plain-manifest path below without needing that permission.
*/ -}}
{{- $existing := lookup "v1" "Namespace" "" $namespaceName -}}
{{- if not $existing }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/resource-policy": keep
{{- end }}
{{- else }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
{{- end }}
{{- end }}
