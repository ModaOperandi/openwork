{{- /*
  ⚠️ ArgoCD/GitOps operators: set createNamespace=false and instead add
  `syncOptions: [CreateNamespace=true]` to the Application. Do not leave
  createNamespace=true under ArgoCD — see why below.

  lookup returns empty under helm template / ArgoCD repo-server rendering (no
  live cluster connection during rendering), so `not $existing` below is
  always true there regardless of whether the namespace already exists. That
  means under ArgoCD this Namespace unconditionally renders as a hook on
  every single sync — and, same as any Helm/Argo CD hook with no explicit
  hook-delete-policy, it defaults to before-hook-creation (Argo CD: "if no
  deletion policy is specified, Argo CD will automatically assume
  BeforeHookCreation rules"; Helm's docs state the identical default).
  Unlike the migration RBAC/ExternalSecret hooks, this default is genuinely
  dangerous here: deleting a Namespace cascades to delete every resource
  inside it, so leaving createNamespace=true under ArgoCD means the whole
  release — Deployments, Secrets, everything — gets torn down and rebuilt on
  every sync. There is no hook-delete-policy value that avoids this while
  keeping the Namespace a hook (before-hook-creation is the only sane choice
  for a resource that must exist before other pre-install hooks, and the
  alternatives — hook-succeeded/hook-failed — would delete the Namespace
  outright once the sync finishes). The only real fix is to keep this
  resource from rendering at all under ArgoCD: set createNamespace=false so
  this whole block is skipped, and let ArgoCD create the namespace itself via
  `syncOptions: [CreateNamespace=true]` — a native, non-hook, one-time
  operation with no delete-then-recreate lifecycle.

  For a genuine (non-ArgoCD) `helm install`/`helm upgrade` CLI run, lookup has
  real cluster access, so this guard behaves as intended: first install
  renders the Namespace as the earliest hook (weight -11, preceding the
  ExternalSecret's -10), then every subsequent `helm upgrade` sees the
  namespace already exists and skips rendering it, never re-entering the
  hook path (and therefore never hitting the before-hook-creation default) at
  all. helm uninstall does not remove hook resources, so the Namespace
  outlives the release even in that path (intentional — deleting it would
  cascade to any externally-created resources in it).

  This does NOT let a first install skip pre-provisioning the *release*
  namespace itself (the one passed via `helm install --namespace`): Helm
  creates its own release-tracking record there before running any hook, so
  if that namespace does not already exist and --create-namespace was not
  passed, the install fails immediately, before this (or any) pre-install
  hook ever runs. This hook only helps when the chart's own `namespace` value
  (above) names a *different*, not-yet-existing namespace than the one Helm's
  release itself lives in (which must already exist, or be created via
  --create-namespace, some other way).

  This rendering is intentionally independent of migrations.hook — the
  Namespace is always a hook whenever createNamespace is true, even when
  migrations.hook=false leaves the ExternalSecret/migration RBAC/migration
  Job as plain manifests. Toggling the SAME resource between a hook and a
  plain manifest across upgrades is unsafe in both directions, confirmed
  empirically against a live cluster: hook -> plain fails outright (a
  hook-created resource never receives Helm's release-ownership labels, so
  presenting it as an ordinary resource in a later release makes Helm refuse
  to adopt it — "exists and cannot be imported into the current release:
  invalid ownership metadata" — hard-failing the upgrade); and even where
  plain -> hook does not hard-fail, it depends entirely on this exact
  resource-policy: keep annotation already having been stamped onto the live
  object by a prior release using this same fix, which cannot be assumed for
  a release from before this file supported non-hook rendering at all. Tying
  the Namespace's hook-ness to a value meant only to help debug the migration
  Job's logs was never a deliberate design goal, so it no longer varies with
  migrations.hook at all.

  Defense in depth on top of all of the above: the Namespace also always
  carries `helm.sh/resource-policy: keep`. Helm's own docs are explicit that
  this "instructs Helm to skip deleting this resource when a helm operation
  (such as helm uninstall, helm upgrade or helm rollback) would result in its
  deletion" — checked against the *live* object's current annotations, not
  the newly-rendered manifest (confirmed empirically: a release stops
  rendering this Namespace at all in a later upgrade, and the live object —
  already carrying this annotation from an earlier release — survives
  regardless). This protects any release already running this fix through
  future changes this template cannot anticipate. It does NOT protect a
  release upgrading directly from a chart version that predates this file
  ever adding the annotation, if that upgrade also causes the Namespace to
  stop being tracked (e.g. createNamespace flipping to its new false default
  for a release that had migrations.hook=false and never pinned
  createNamespace explicitly) — the live object in that case was never
  stamped with `keep` by any release, so nothing in this file can retroactively
  protect it. See the chart's release notes for that one-time migration
  case; it needs an operator-side precaution (e.g. `kubectl annotate
  namespace <ns> helm.sh/resource-policy=keep`) taken before upgrading, not a
  template-side fix, since the danger is rooted entirely in what a prior,
  already-applied release recorded, which this template has no way to see.
*/ -}}
{{- $namespaceName := include "openwork-ee.namespace" . | trimAll "\"" -}}
{{- if .Values.createNamespace -}}
{{- $existing := lookup "v1" "Namespace" "" $namespaceName -}}
{{- if not $existing }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/resource-policy": keep
{{- end }}
{{- end }}
