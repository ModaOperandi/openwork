{{- /*
  RBAC for the migration Job's wait-for-secret init container: the Job polls
  for an asynchronously materialized Secret (ESO / out-of-band creation)
  instead of failing on the env secretKeyRef. Rendered only outside inline
  mode. In hook mode these must be hooks with an earlier weight than the Job
  (-6 precedes the Job's -5) so they exist before it starts.

  No hook-delete-policy here (unlike the Job): a ServiceAccount/Role/
  RoleBinding is fully idempotent RBAC state with no run history to reset, so
  it only needs to exist before the Job starts, not be deleted and recreated
  on every sync. before-hook-creation would instead race ArgoCD's own
  delete-then-create sequencing on automated-sync retries — a delete that
  hasn't fully propagated before the following create attempt reports
  "already exists" and fails the whole sync, sometimes indefinitely. Ordering
  via hook-weight alone, applied in place like a normal manifest, avoids that
  race entirely.
*/}}
{{- /* Runs the legacy create=false shim before the secretsMode check below. */}}
{{- include "openwork-ee.secretsMode.validate" . }}
{{- if and .Values.migrations.enabled (ne .Values.secret.secretsMode "inline") }}
{{- $asHook := .Values.migrations.hook }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "openwork-ee.secretName" . }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openwork-ee.fullname" . }}-migrate
subjects:
  - kind: ServiceAccount
    name: {{ include "openwork-ee.fullname" . }}-migrate
    namespace: {{ include "openwork-ee.namespace" . }}
{{- end }}
