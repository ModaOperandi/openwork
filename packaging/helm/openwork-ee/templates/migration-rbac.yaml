{{- /*
  RBAC for the migration Job's wait-for-secret init container: the Job polls
  for an asynchronously materialized Secret (ESO / out-of-band creation)
  instead of failing on the env secretKeyRef. Rendered only outside inline
  mode. In hook mode these must be hooks with an earlier weight than the Job
  (-6 precedes the Job's -5) so they exist before it starts.

  before-hook-creation is explicit here even though it is also Helm's and
  Argo CD's documented default for an unannotated hook (Argo CD: "if no
  deletion policy is specified, Argo CD will automatically assume
  BeforeHookCreation rules") — omitting the annotation does not disable
  delete-then-create, it renders it implicitly. That default is tolerable for
  these three: they are leaf, non-cascading RBAC objects with no finalizers,
  so the delete completes near-instantly and the following create rarely (if
  ever) collides. Contrast the Namespace hook (templates/namespace.yaml),
  where the very same default is dangerous because deleting it cascades to
  every resource inside — see that file's comment for the real mitigation.
*/}}
{{- /* Runs the legacy create=false shim before the secretsMode check below. */}}
{{- include "openwork-ee.secretsMode.validate" . }}
{{- if and .Values.migrations.enabled (ne .Values.secret.secretsMode "inline") }}
{{- $asHook := .Values.migrations.hook }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "openwork-ee.secretName" . }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if $asHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "openwork-ee.fullname" . }}-migrate
subjects:
  - kind: ServiceAccount
    name: {{ include "openwork-ee.fullname" . }}-migrate
    namespace: {{ include "openwork-ee.namespace" . }}
{{- end }}
