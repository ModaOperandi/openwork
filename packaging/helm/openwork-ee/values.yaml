redis:
  # Prefer rediss:// DATABASE_REDIS_URL values. Set this to true only for
  # trusted private, non-public Redis endpoints that do not support TLS, such as
  # some managed internal Redis URLs exposed by hosting platforms.
  allowInsecureInternal: false

secret:
  # How this deployment manages secrets. One of:
  #   inline:         the chart renders a v1/Secret from secret.values.
  #                   Local evaluation only — the values live wherever this
  #                   values file lives, so never commit real credentials.
  #   existingSecret: workloads consume a pre-created Secret named by
  #                   secret.existingSecret; the chart renders nothing.
  #   externalSecrets: the chart renders an ExternalSecret (ESO) that
  #                   materializes the workload Secret from an external provider
  #                   — the GitOps/ArgoCD-safe path; git holds only store
  #                   references and remote key paths.
  secretsMode: inline
  # Must be true when secretsMode: inline and false in every other mode; the
  # render fails otherwise. Exception: legacy values files upgraded from
  # before secretsMode that set create: false with the untouched placeholder
  # values below are auto-corrected to existingSecret mode (using the
  # chart-created secret name when existingSecret is blank) — real values with
  # create: false still fail the render.
  create: true
  # REQUIRED when secretsMode: existingSecret — must be populated, not blank
  # or empty (the render fails otherwise). Must stay empty in other modes.
  existingSecret: ""
  keys:
    databaseUrl: DATABASE_URL
    databaseRedisUrl: DATABASE_REDIS_URL
    betterAuthSecret: BETTER_AUTH_SECRET
    denDbEncryptionKey: DEN_DB_ENCRYPTION_KEY
    daytonaApiKey: DAYTONA_API_KEY
    polarAccessToken: POLAR_ACCESS_TOKEN
    openRouterManagementApiKey: OPENROUTER_MANAGEMENT_API_KEY
    inferenceAdminToken: INFERENCE_ADMIN_TOKEN
    inferenceWebhookSecret: INFERENCE_WEBHOOK_SECRET
    emailFrom: EMAIL_FROM
    smtpHost: SMTP_HOST
    smtpPort: SMTP_PORT
    smtpUser: SMTP_USER
    smtpPass: SMTP_PASS
    smtpSecure: SMTP_SECURE
    githubConnectorAppClientSecret: GITHUB_CONNECTOR_APP_CLIENT_SECRET
    githubConnectorAppPrivateKey: GITHUB_CONNECTOR_APP_PRIVATE_KEY
    githubConnectorAppWebhookSecret: GITHUB_CONNECTOR_APP_WEBHOOK_SECRET
    connectLinkPrivateKey: DEN_CONNECT_LINK_PRIVATE_KEY
    initialAdminBootstrapCode: DEN_INITIAL_ADMIN_BOOTSTRAP_CODE
  # Used ONLY when secretsMode: inline; ignored otherwise. REQUIRED then:
  # databaseUrl, betterAuthSecret, denDbEncryptionKey (the workloads cannot
  # start without them). Never commit real credentials here — use
  # externalSecrets mode for anything beyond local evaluation.
  values:
    databaseUrl: mysql://openwork:change-me@mysql:3306/openwork_den
    databaseRedisUrl: ""
    betterAuthSecret: CHANGE_ME_32_CHARS_MINIMUM_BETTER_AUTH
    denDbEncryptionKey: CHANGE_ME_32_CHARS_MINIMUM_DB_ENCRYPTION
    daytonaApiKey: ""
    polarAccessToken: ""
    openRouterManagementApiKey: ""
    inferenceAdminToken: ""
    inferenceWebhookSecret: ""
    emailFrom: ""
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPass: ""
    smtpSecure: "false"
    githubConnectorAppClientSecret: ""
    githubConnectorAppPrivateKey: ""
    githubConnectorAppWebhookSecret: ""
    connectLinkPrivateKey: ""
    initialAdminBootstrapCode: ""

# External Secrets Operator (ESO) configuration. Active only when
# secretsMode: externalSecrets; the chart renders an ExternalSecret that
# materializes the workload Secret from the provider. Requires ESO and a
# SecretStore/ClusterSecretStore on the destination cluster.
externalSecrets:
  # ATTENTION: the three boot-critical keys (DATABASE_URL, BETTER_AUTH_SECRET,
  # DEN_DB_ENCRYPTION_KEY) and every key you list under optionalKeys must exist
  # in your provider — where depends on keyLayout (see below). In the default
  # perKey layout, the chart pulls each rendered key by name from
  # <pathPrefix>/<KEY_NAME>. In singleSecret layout, every rendered key instead
  # comes from a same-named JSON property inside the one combined secret named
  # exactly pathPrefix. Either way, a missing rendered key fails the
  # ExternalSecret; keys you neither need nor list are not pulled.
  # How often ESO re-syncs the Secret from the provider.
  refreshInterval: 1h
  # Store holding the remote keys. For AWS Secrets Manager the store's
  # spec.provider.aws is configured on the (Cluster)SecretStore itself; the
  # chart only references it by name.
  secretStoreRef:
    # REQUIRED when secretsMode: externalSecrets — must be populated, not
    # blank or empty (the render fails otherwise), and must match the name of
    # your SecretStore/ClusterSecretStore. Without it ESO has no provider to
    # read from.
    name: "external-secrets"
    kind: ClusterSecretStore
  target:
    # Owner deletes the Secret with the ExternalSecret; Merge keeps it.
    creationPolicy: Owner
    # Retain keeps the Secret if the ExternalSecret is deleted.
    deletionPolicy: Retain
  # How keys map onto provider entries. "perKey" (default) pulls one provider
  # secret per env var, named <pathPrefix>/<KEY_NAME> — see pathPrefix below.
  # "singleSecret" instead pulls every key as a JSON property of one combined
  # provider secret named exactly pathPrefix — use this when your provider
  # stores one secret per service (e.g. AWS Secrets Manager entries like
  # eks/<project>/<env>/<service> holding a JSON object of key/value pairs)
  # rather than one entry per key.
  keyLayout: perKey
  # Remote path trunk. In keyLayout: perKey, keys are pulled from
  # <pathPrefix>/<KEY_NAME>. In keyLayout: singleSecret, pathPrefix is instead
  # the exact name of the single combined secret and each key is read from its
  # same-named JSON property inside it. The chart renders spec.data for the
  # three boot-critical keys (DATABASE_URL, BETTER_AUTH_SECRET,
  # DEN_DB_ENCRYPTION_KEY) plus the entries explicitly selected in
  # optionalKeys. The optional list is opt-in and maintained by hand — if a
  # future feature starts consuming a new secret key, add its secret.keys.*
  # name to optionalKeys and create the provider entry.
  # REQUIRED when secretsMode: externalSecrets (render fails if blank).
  # Example (AWS Secrets Manager, perKey): pathPrefix: "eks/openwork/prod/den"
  # Example (AWS Secrets Manager, singleSecret): the same pathPrefix, but
  # eks/openwork/prod/den is itself one secret holding
  # {"DATABASE_URL": "...", "BETTER_AUTH_SECRET": "...", ...}.
  pathPrefix: ""
  # Optional keys to also pull from the provider. Entries are secret.keys
  # property names (camelCase, e.g. smtpPass, databaseRedisUrl); the target
  # Secret key uses the corresponding value (SMTP_PASS), which is also the
  # provider path suffix in perKey layout or the JSON property name in
  # singleSecret layout. Only listed keys get a spec.data entry — ESO's
  # remoteRef has no "skip if missing", so keys you do not list here need not
  # exist in the provider and simply do not land in the Secret.
  optionalKeys: []
  # Seconds the workload init container waits for an optional key to appear in
  # the materialized Secret before starting without it. envFrom snapshots keys
  # at pod start, so a pod that boots before ESO reconciles a newly added
  # optional key would otherwise hold a stale environment until its next
  # restart. Required keys always block indefinitely. Set 0 to skip waiting
  # for optional keys entirely.
  optionalKeyWaitSeconds: 60
  # Strategy fields applied uniformly to every pulled key (ESO defaults,
  # matching the external-secrets.io/v1 schema).
  conversionStrategy: Default
  decodingStrategy: None
  metadataPolicy: None

