migrations:
  enabled: true
  hook: true
  # before-hook-creation gives each hook run a clean slate (a Job's pod
  # template is immutable, so re-running migrations requires a fresh Job
  # object). The migration RBAC (ServiceAccount/Role/RoleBinding) and
  # ExternalSecret hooks also carry this same policy explicitly — see the
  # comments in templates/migration-rbac.yaml and templates/externalsecret.yaml
  # for why it is tolerable there (leaf, non-cascading resources) but
  # dangerous for the Namespace hook (templates/namespace.yaml), which is why
  # createNamespace defaults to false. hook-succeeded and hook-failed
  # additionally delete the Job right after it finishes, whichever way —
  # without hook-failed, a failed run used to sit until the next sync's
  # before-hook-creation delete tried to clear it, and if that delete raced
  # ArgoCD's own retry timing, the stale Job (and the namespace behind it via
  # ArgoCD's hook-finalizer) could get stuck Terminating indefinitely.
  hookDeletePolicy: before-hook-creation,hook-succeeded,hook-failed
  backoffLimit: 2
  activeDeadlineSeconds: 600
  podAnnotations: {}
  resources: {}
  # Pinned kubectl image for the wait-for-secret init container (non-inline
  # secretsModes). Keep this at a specific patch version (or digest); avoid
  # floating tags so installs are reproducible.
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.33.4"
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: openwork.example.com
    path: /
    pathType: Prefix
  api:
    enabled: true
    host: api.openwork.example.com
    path: /
    pathType: Prefix
  tls: []
