# Google Cloud GKE starter values for a first OpenWork EE self-host install.
#
# Copy this file, replace every REPLACE_* value, and install with:
#
#   helm upgrade --install openwork-ee oci://ghcr.io/different-ai/charts/openwork-ee \
#     --version REPLACE_OPENWORK_VERSION \
#     --namespace openwork-ee \
#     --create-namespace \
#     -f values.gcp.yaml
#
# This example exposes Den Web and Den API through GKE Ingress with a reserved
# global IP and Google-managed certificate. Apply the ManagedCertificate and
# BackendConfig manifests from docs/gcp-gke-helm.md before installing.

# Must match the --namespace above: with createNamespace at its chart default
# (false), nothing else creates this namespace, and --create-namespace only
# creates the one the Helm release itself lives in.
namespace: openwork-ee

image:
  tag: "REPLACE_OPENWORK_VERSION"
  pullPolicy: IfNotPresent

config:
  tenancy:
    mode: single_org
    singleOrgName: "REPLACE_COMPANY_NAME"
    singleOrgSlug: "REPLACE_COMPANY_SLUG"
    ownerEmails: "REPLACE_ADMIN_EMAIL"
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  auth:
    passwordBreachScreeningEnabled: "false"
  public:
    webOrigin: "https://REPLACE_WEB_HOST"
    # Split-origin compatibility override for this two-host ingress example.
    # Leave blank in single-origin deployments so Den derives it from webOrigin.
    apiOrigin: "https://REPLACE_API_HOST"
    mcpResourceUrl: "https://REPLACE_API_HOST/mcp"
    mcpClaimNamespace: "https://REPLACE_WEB_HOST"
    desktopDenBaseUrl: ""
    corsOrigins: "https://REPLACE_WEB_HOST,https://REPLACE_API_HOST"
    betterAuthTrustedOrigins: "https://REPLACE_WEB_HOST"
    webAppHosts: "REPLACE_WEB_HOST"
    bootstrapAdminEmails: "REPLACE_ADMIN_EMAIL"
    authCallbackUrl: "https://REPLACE_WEB_HOST"
    # Automations are opt-in for self-hosted deployments. A fresh install has no
    # legacy Desktop clients, so both values stay "false" and the routes,
    # scheduler, and MCP resources are omitted. Set both to "true" to turn them
    # on. See the "Automations rollout" section in the chart README first.
    automationsEnabled: "false"
    automationsRuntimeEnabled: "false"
  provisioner:
    mode: stub

secret:
  create: true
  values:
    # Direct private IP Cloud SQL example. The current chart does not inject
    # Cloud SQL Auth Proxy sidecars, so use a private IP reachable from GKE.
    databaseUrl: "mysql://openwork:REPLACE_DB_PASSWORD@REPLACE_CLOUD_SQL_PRIVATE_IP:3306/openwork_den"
    # Generate with: openssl rand -base64 48
    betterAuthSecret: "REPLACE_BETTER_AUTH_SECRET"
    # Generate separately with: openssl rand -base64 48
    denDbEncryptionKey: "REPLACE_DEN_DB_ENCRYPTION_KEY"
    # One-time /setup code. Generate a unique value and keep it out of source control.
    initialAdminBootstrapCode: "REPLACE_BOOTSTRAP_CODE"

denApi:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8788
    annotations:
      cloud.google.com/backend-config: '{"default": "openwork-ee-den-api-backend"}'
      cloud.google.com/neg: '{"ingress": true}'

denWeb:
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3005
    annotations:
      cloud.google.com/backend-config: '{"default": "openwork-ee-den-web-backend"}'
      cloud.google.com/neg: '{"ingress": true}'

inference:
  enabled: false

migrations:
  enabled: true
  hook: true

ingress:
  enabled: true
  className: ""
  # Shared across both Ingress objects: the managed certificate covers both
  # hosts, so it is safe to reuse here. The reserved static IP is NOT — GKE
  # gives each Ingress its own GCLB, so two Ingresses referencing the same
  # global-static-ip-name would fight over one forwarding rule and only one
  # would reconcile. Each host therefore gets its own reserved IP below.
  annotations:
    kubernetes.io/ingress.class: gce
    networking.gke.io/managed-certificates: REPLACE_MANAGED_CERTIFICATE_NAME
  web:
    host: REPLACE_WEB_HOST
    annotations:
      kubernetes.io/ingress.global-static-ip-name: REPLACE_WEB_GLOBAL_STATIC_IP_NAME
  api:
    enabled: true
    host: REPLACE_API_HOST
    annotations:
      kubernetes.io/ingress.global-static-ip-name: REPLACE_API_GLOBAL_STATIC_IP_NAME
